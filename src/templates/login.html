{% extends "base.html" %}
{% block titulo %}Ingresar · Cacao con Historia{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>Ingresar</h1>
  <form method="post">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
  </form>
  <p class="nota">Demostración: operador / operador123 · admin / admin123</p>
</section>
{% endblock %}
