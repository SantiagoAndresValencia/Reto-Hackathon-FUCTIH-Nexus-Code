{% extends "base.html" %}
{% block titulo %}Recibir lote · Cacao con Historia{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1>Recibir lote</h1>
  <form method="post" novalidate>
    <div class="campos">
      <div>
        <label for="codigo">Código del lote</label>
        <input id="codigo" name="codigo" value="{{ datos.get('codigo', '') }}" placeholder="CAC004">
      </div>
      <div>
        <label for="productor">Productor</label>
        <input id="productor" name="productor" value="{{ datos.get('productor', '') }}">
      </div>
      <div>
        <label for="origen">Origen (municipio)</label>
        <input id="origen" name="origen" value="{{ datos.get('origen', '') }}" placeholder="Rivera">
      </div>
      <div>
        <label for="fecha_recepcion">Fecha de recepción</label>
        <input id="fecha_recepcion" name="fecha_recepcion" type="date" value="{{ datos.get('fecha_recepcion', '') }}">
      </div>
      <div>
        <label for="cantidad">Cantidad (kg de cacao seco)</label>
        <input id="cantidad" name="cantidad" inputmode="decimal" value="{{ datos.get('cantidad', '') }}">
      </div>
    </div>
    <button type="submit">Guardar lote</button>
  </form>
</section>
{% endblock %}
