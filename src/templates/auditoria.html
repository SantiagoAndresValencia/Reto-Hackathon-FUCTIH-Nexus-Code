<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoría</title>
</head>
<body>
  <h1>Auditoría</h1>
  <p><a href="{{ url_for('lotes.lista_lotes') }}">Ver lotes</a></p>
  <form method="get">
    <label for="q">Lote o producto</label> <input id="q" name="q" value="{{ q }}">
    <button type="submit">Buscar</button>
  </form>
  <table border="1" cellpadding="6">
    <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Registro</th><th>Campo</th><th>Antes</th><th>Después</th></tr>
    {% for a in filas %}
    <tr>
      <td>{{ a.fecha }}</td><td>{{ a.usuario }}</td><td>{{ a.accion }}</td>
      <td>{{ a.entidad }} {{ a.entidad_id }}</td><td>{{ a.campo }}</td>
      <td>{{ a.valor_anterior }}</td><td>{{ a.valor_nuevo }}</td>
    </tr>
    {% else %}
    <tr><td colspan="7">Sin registros.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
